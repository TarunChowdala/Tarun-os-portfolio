<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a2332"/>
      <stop offset="0.5" stop-color="#0d1118"/>
      <stop offset="1" stop-color="#15202b"/>
    </linearGradient>
    <linearGradient id="glow" x1="640" y1="120" x2="640" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5b9fd4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5b9fd4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="640" cy="280" rx="420" ry="180" fill="url(#glow)"/>

  <!-- Abstract window chrome -->
  <rect x="220" y="140" width="840" height="440" rx="20" fill="#0b0f14" stroke="#ffffff" stroke-opacity="0.1"/>
  <rect x="220" y="140" width="840" height="48" rx="20" fill="#ffffff" fill-opacity="0.04"/>
  <circle cx="252" cy="164" r="6" fill="#ff5f57" fill-opacity="0.7"/>
  <circle cx="276" cy="164" r="6" fill="#febc2e" fill-opacity="0.7"/>
  <circle cx="300" cy="164" r="6" fill="#28c840" fill-opacity="0.7"/>
  <rect x="480" y="156" width="200" height="16" rx="8" fill="#ffffff" fill-opacity="0.08"/>

  <!-- Channel tiles (generic, not product UI) -->
  <rect x="280" y="230" width="200" height="120" rx="14" fill="url(#card)" stroke="#5b9fd4" stroke-opacity="0.25"/>
  <rect x="310" y="258" width="80" height="10" rx="5" fill="#5b9fd4" fill-opacity="0.55"/>
  <rect x="310" y="282" width="140" height="8" rx="4" fill="#ffffff" fill-opacity="0.12"/>
  <rect x="310" y="302" width="110" height="8" rx="4" fill="#ffffff" fill-opacity="0.08"/>

  <rect x="540" y="230" width="200" height="120" rx="14" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.1"/>
  <rect x="570" y="258" width="90" height="10" rx="5" fill="#7eb8a8" fill-opacity="0.55"/>
  <rect x="570" y="282" width="140" height="8" rx="4" fill="#ffffff" fill-opacity="0.12"/>
  <rect x="570" y="302" width="100" height="8" rx="4" fill="#ffffff" fill-opacity="0.08"/>

  <rect x="800" y="230" width="200" height="120" rx="14" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.1"/>
  <rect x="830" y="258" width="70" height="10" rx="5" fill="#c4a35a" fill-opacity="0.55"/>
  <rect x="830" y="282" width="140" height="8" rx="4" fill="#ffffff" fill-opacity="0.12"/>
  <rect x="830" y="302" width="120" height="8" rx="4" fill="#ffffff" fill-opacity="0.08"/>

  <!-- Flow line -->
  <path d="M320 420 H960" stroke="#5b9fd4" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="8 10"/>
  <circle cx="320" cy="420" r="8" fill="#5b9fd4" fill-opacity="0.5"/>
  <circle cx="540" cy="420" r="8" fill="#5b9fd4" fill-opacity="0.35"/>
  <circle cx="760" cy="420" r="8" fill="#5b9fd4" fill-opacity="0.35"/>
  <circle cx="960" cy="420" r="8" fill="#5b9fd4" fill-opacity="0.5"/>

  <rect x="300" y="460" width="160" height="56" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="560" y="460" width="160" height="56" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="820" y="460" width="160" height="56" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>

  <text x="640" y="640" text-anchor="middle" fill="#8b8b96" font-family="IBM Plex Mono, monospace" font-size="14" letter-spacing="3">COMPANY PROJECT · UI WITHHELD</text>
</svg>
